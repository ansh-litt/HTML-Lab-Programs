<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Login</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f4f1ea; font-family: Arial, sans-serif; }
        .login { width: min(350px, calc(100% - 32px)); background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 20px #aaa; }
        h1, h2, p { text-align: center; }
        h1, h2 { color: #5c4033; }
        p { color: #777; }
        label { display: block; margin: 12px 0 5px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .option { display: flex; justify-content: space-between; gap: 8px; margin: 15px 0; font-size: 13px; }
        button { width: 100%; padding: 11px; border: 0; border-radius: 5px; background: #5c4033; color: white; font-weight: bold; cursor: pointer; }
        a { color: #5c4033; text-decoration: none; }
        .bottom { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="login">
        <h1>BookNest</h1>
        <p>Your Online Book Store</p>
        <h2>Welcome Back</h2>
        <form>
            <label for="username">Email / Username</label>
            <input id="username" type="text" placeholder="Enter email or username" required>
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter password" required>
            <div class="option">
                <label><input type="checkbox"> Remember Me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit">LOGIN</button>
        </form>
        <div class="bottom">
            <p>Don't have an account? <a href="program6.html">Sign Up</a></p>
            <a href="program2.html">← Back to Home</a>
        </div>
    </div>
</body>
</html>
