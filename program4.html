<html lang="en">
<head>

    <title>Book Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; }
        h1 { text-align: center; color: darkblue; }
        table { width: 90%; margin: 30px auto; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #555; padding: 12px; text-align: center; }
        th { background: darkblue; color: white; }
        tr:nth-child(even) { background: #eee; }

<body>

        <tr><td>Computer Networks</td><td>Andrew S. Tanenbaum</td><td>Networking</td><td>Pearson</td><td>₹600</td></tr>
        <tr><td>Database System</td><td>Raghu Ramakrishnan</td><td>Database</td><td>McGraw Hill</td><td>₹500</td></tr>

</html>
