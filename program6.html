<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Registration</title>
</head>
<body>
    <center>
        <h1>BOOK NEST</h1>
        <h2>Registration Form</h2>
        <form>
            <table cellpadding="8">
                <tr><td><label for="name"><b>Name:</b></label></td><td><input id="name" type="text" placeholder="Enter your name" required></td></tr>
                <tr><td><label for="password"><b>Password:</b></label></td><td><input id="password" type="password" placeholder="Enter password" required></td></tr>
                <tr><td><label for="email"><b>E-mail ID:</b></label></td><td><input id="email" type="email" placeholder="Enter email" required></td></tr>
                <tr><td><label for="phone"><b>Phone Number:</b></label></td><td><input id="phone" type="tel" placeholder="Enter phone number"></td></tr>
                <tr><td><label for="language"><b>Language:</b></label></td><td><select id="language"><option>English</option><option>Hindi</option><option>Punjabi</option></select></td></tr>
                <tr><td><b>Gender:</b></td><td><label><input type="radio" name="gender" value="male"> Male</label> <label><input type="radio" name="gender" value="female"> Female</label></td></tr>
                <tr><td><label for="address"><b>Address:</b></label></td><td><textarea id="address" rows="4" cols="25" placeholder="Enter your address"></textarea></td></tr>
                <tr><td colspan="2" align="center"><input type="submit" value="Register"> <input type="reset" value="Clear"></td></tr>
            </table>
        </form>
        <p>Already have an account? <a href="program3.html">Login Here</a></p>
    </center>
</body>
</html>
